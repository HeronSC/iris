use_default_settings: true

general:
  instance_name: "Iris search"
  debug: false
  enable_metrics: false

server:
  secret_key: "iris-local-searxng-not-exposed-beyond-loopback"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
